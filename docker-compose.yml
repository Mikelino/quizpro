version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: quizpro-pg
    environment:
      POSTGRES_USER: quizpro
      POSTGRES_PASSWORD: quizpro
      POSTGRES_DB: quizpro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: quizpro-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
